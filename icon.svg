<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d4a25"/>
      <stop offset="50%" style="stop-color:#1a2f1a"/>
      <stop offset="100%" style="stop-color:#0d1210"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8bab7a"/>
      <stop offset="100%" style="stop-color:#6b8b5a"/>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4d4b0"/>
      <stop offset="100%" style="stop-color:#a8c898"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Subtle glow -->
  <circle cx="256" cy="240" r="120" fill="rgba(139, 171, 122, 0.1)"/>
  
  <!-- Heart shape -->
  <path d="M256 420 C156 340 96 280 96 200 C96 140 144 96 200 96 C232 96 256 116 256 116 C256 116 280 96 312 96 C368 96 416 140 416 200 C416 280 356 340 256 420 Z" 
        fill="url(#heart)" 
        opacity="0.9"/>
  
  <!-- Checkmark -->
  <path d="M200 240 L240 280 L320 180" 
        fill="none" 
        stroke="url(#check)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Small decorative elements -->
  <circle cx="160" cy="380" r="8" fill="rgba(139, 171, 122, 0.4)"/>
  <circle cx="352" cy="380" r="6" fill="rgba(139, 171, 122, 0.3)"/>
  <circle cx="130" cy="320" r="5" fill="rgba(139, 171, 122, 0.25)"/>
  <circle cx="382" cy="320" r="7" fill="rgba(139, 171, 122, 0.35)"/>
</svg>
