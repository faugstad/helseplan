<!DOCTYPE html>
<html lang="no">
<head>

  <!-- PWA Manifest -->

  <!-- Icons -->

  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: linear-gradient(145deg, #1a1f1a 0%, #0d1210 50%, #0a0f0d 100%);
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e8ebe8;
      overscroll-behavior: none;
    }
    
    #root {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding-bottom: calc(70px + env(safe-area-inset-bottom));
    }
    
    /* Mobile-optimized buttons with better feedback */
    .check-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 10px;
      border: 2px solid rgba(120, 140, 100, 0.3);
      background: rgba(20, 28, 20, 0.5);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #e8ebe8;
      -webkit-appearance: none;
      appearance: none;
    }
    
    .check-btn:active {
      transform: scale(0.9);
      background: rgba(60, 80, 50, 0.5);
    }
    
    .check-btn.checked {
      background: linear-gradient(135deg, #4a6b3a 0%, #3d5a30 100%);
      border-color: #6b8b5a;
      box-shadow: 0 0 20px rgba(100, 140, 80, 0.3);
    }
    
    .check-btn.checked:active {
      transform: scale(0.9);
    }
    
    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(20, 28, 20, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(100, 120, 90, 0.2);
      display: flex;
      justify-content: space-around;
      padding: 8px 4px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    
    .nav-btn {
      background: transparent;
      border: none;
      color: #5a6a5a;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 12px;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 60px;
    }
    
    .nav-btn:active {
      transform: scale(0.95);
    }
    
    .nav-btn.active {
      color: #a8d898;
      background: rgba(100, 140, 80, 0.15);
    }
    
    .nav-btn .nav-icon {
      font-size: 20px;
      line-height: 1;
    }
    
    .card {
      background: linear-gradient(165deg, rgba(40, 50, 40, 0.4) 0%, rgba(25, 32, 25, 0.6) 100%);
      border: 1px solid rgba(120, 140, 100, 0.15);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    button.card:active {
      transform: scale(0.98);
      background: linear-gradient(165deg, rgba(50, 65, 50, 0.5) 0%, rgba(35, 45, 35, 0.7) 100%);
    }
    
    .exercise-card {
      background: rgba(30, 40, 30, 0.3);
      border: 1px solid rgba(100, 120, 90, 0.1);
      border-radius: 12px;
      padding: 14px;
    }
    
    .timer-btn {
      background: linear-gradient(135deg, #3d5a30 0%, #2d4a25 100%);
      border: 1px solid rgba(100, 140, 80, 0.3);
      color: #c4d4b0;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      min-height: 48px;
      transition: all 0.15s ease;
    }
    
    .timer-btn:active {
      transform: scale(0.97);
    }
    
    .progress-ring {
      transform: rotate(-90deg);
    }
    
    .glow-text {
      text-shadow: 0 0 40px rgba(180, 200, 160, 0.15);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes celebrate {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    .celebrate {
      animation: celebrate 0.4s ease-out;
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .slide-up {
      animation: slideUp 0.3s ease-out forwards;
    }
    
    /* Streak badge */
    .streak-badge {
      background: linear-gradient(135deg, #ff8c42 0%, #ff5722 100%);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 10px rgba(255, 87, 34, 0.3);
    }
    
    /* Quick action button */
    .quick-btn {
      transition: all 0.15s ease;
    }
    
    .quick-btn:active {
      transform: scale(0.95);
    }
    
    .supp-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: rgba(0,0,0,0.15);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      width: 100%;
      text-align: left;
    }
    
    .supp-row:active {
      transform: scale(0.98);

    }
    
    .supp-row.checked {
      background: rgba(60, 100, 50, 0.25);
      border-color: rgba(100, 140, 80, 0.3);
    }
    
    /* Today highlight pulse */
    @keyframes todayPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(140, 170, 120, 0.4); }
      50% { box-shadow: 0 0 0 4px rgba(140, 170, 120, 0); }
    }
    
    .today-btn {
      animation: todayPulse 2s ease-in-out infinite;
    }
    
    /* Safe area padding for notched phones */
    .safe-area-top {
      padding-top: max(16px, env(safe-area-inset-top));
    }
    
    /* Prevent pull-to-refresh */
    body {
      overscroll-behavior-y: contain;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Helper: Get week number
    const getWeekNumber = (date) => {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    };
    
    const getWeekKey = (date) => {
      const week = getWeekNumber(date);
      const year = date.getFullYear();
      return `${year}-W${week.toString().padStart(2, '0')}`;
    };

    function HealthDashboard() {
      const [activeTab, setActiveTab] = useState('oversikt');
      const [selectedDay, setSelectedDay] = useState(new Date().getDay() === 0 ? 6 : new Date().getDay() - 1);
      const [showHistory, setShowHistory] = useState(false);
      
      const dayKeys = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
      const dayLabels = ['M', 'T', 'O', 'T', 'F', 'L', 'S'];
      const dayLabelsFull = ['Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag', 'Søndag'];
      
      const defaultSupplements = {
        kefir: false, probiotic: false, d3k2: false, tran: false,
        collagen: false, kreatin: false,
        magnesium: false, glycine: false, theanine: false
      };
      
      const defaultDayData = { supplements: { ...defaultSupplements }, completed: false };
      
      const createFreshWeek = () => ({
        sundayAlcoholFree: false,
        exerciseSessions: { session1: false, session2: false },
        trainingSessions: { trening1: false, trening2: false },
        bidetRoutine: false,
        exerciseChecks: { bretzel: false, hipflexor: false, hip90: false, wgs: false, thoracic: false, pec: false },
        dailySupplements: {
          mon: { ...defaultDayData },
          tue: { ...defaultDayData },
          wed: { ...defaultDayData },
          thu: { ...defaultDayData },
          fri: { ...defaultDayData },
          sat: { ...defaultDayData },
          sun: { ...defaultDayData }
        }
      });
      
      const currentWeekKey = getWeekKey(new Date());
      
      const getInitialState = () => {
        try {
          const saved = localStorage.getItem('healthDashboardHistory');
          if (saved) {
            const parsed = JSON.parse(saved);
            // Return current week data or create fresh
            if (!parsed.weeks) {
              parsed.weeks = {};
            }
            if (!parsed.weeks[currentWeekKey]) {
              parsed.weeks[currentWeekKey] = createFreshWeek();
            }
            return parsed;
          }
        } catch (e) {
          console.log('Could not load from localStorage');
        }
        return { 
          weeks: { [currentWeekKey]: createFreshWeek() },
          startDate: new Date().toISOString()
        };
      };
      
      const [allData, setAllData] = useState(getInitialState);
      const [breakTimer, setBreakTimer] = useState(45 * 60);
      const [timerActive, setTimerActive] = useState(false);
      const [syncStatus, setSyncStatus] = useState('');
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [showConnectDevice, setShowConnectDevice] = useState(false);
      const [inputBinId, setInputBinId] = useState('');
      const [copyStatus, setCopyStatus] = useState('');
      
      // JSONBin config
      const JSONBIN_API_KEY = '$2a$10$5T/jbtbPRNOyQdPY7H6w5O8eBYVnXl8KNQzH64UWSENJNPDdS0.2i';
      const getBinId = () => localStorage.getItem('helseplan_bin_id');
      const setBinId = (id) => localStorage.setItem('helseplan_bin_id', id);
      
      const copyBinId = () => {
        const binId = getBinId();
        if (!binId) {
          setCopyStatus('❌ Ingen ID funnet');
          setTimeout(() => setCopyStatus(''), 2000);
          return;
        }
        navigator.clipboard.writeText(binId).then(() => {
          setCopyStatus('✓ Kopiert!');
          setTimeout(() => setCopyStatus(''), 2000);
        }).catch(() => {
          setCopyStatus('❌ Feil');
          setTimeout(() => setCopyStatus(''), 2000);
        });
      };
      
      const connectToDevice = () => {
        if (!inputBinId.trim()) return;
        setBinId(inputBinId.trim());
        setInputBinId('');
        setShowConnectDevice(false);
        setSyncStatus('✓ Koblet til! Trykk "Hent backup" nå.');
        setTimeout(() => setSyncStatus(''), 4000);
      };
      
      // Backup to cloud
      const backupToCloud = async () => {
        setSyncStatus('Lagrer...');
        try {
          const binId = getBinId();

          // Include supplement data in backup
          const backupData = {
            ...allData,
            suppList: allSupplements,
            suppConfig: suppConfig,
            lastBackup: new Date().toISOString()
          };

          if (binId) {
            // Update existing bin
            const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': JSONBIN_API_KEY
              },
              body: JSON.stringify(backupData)
            });
            if (!res.ok) throw new Error('Backup failed');
          } else {
            // Create new bin
            const res = await fetch('https://api.jsonbin.io/v3/b', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': JSONBIN_API_KEY,
                'X-Bin-Name': 'helseplan-backup'
              },
              body: JSON.stringify(backupData)
            });
            if (!res.ok) throw new Error('Backup failed');
            const data = await res.json();
            setBinId(data.metadata.id);
          }

          setSyncStatus('✓ Lagret!');
          setTimeout(() => setSyncStatus(''), 3000);
        } catch (e) {
          console.error(e);
          setSyncStatus('❌ Feil ved lagring');
          setTimeout(() => setSyncStatus(''), 3000);
        }
      };
      
      // Restore from cloud
      const restoreFromCloud = async () => {
        const binId = getBinId();
        if (!binId) {
          setSyncStatus('❌ Ingen backup funnet');
          setTimeout(() => setSyncStatus(''), 3000);
          return;
        }

        setSyncStatus('Henter...');
        try {
          const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
          });
          if (!res.ok) throw new Error('Restore failed');

          const json = await res.json();
          const restored = json.record;
          delete restored.lastBackup;

          // Restore supplement data if present
          if (restored.suppList) {
            setAllSupplements(restored.suppList);
            localStorage.setItem('helseplan_supp_list', JSON.stringify(restored.suppList));
            delete restored.suppList;
          }

          if (restored.suppConfig) {
            setSuppConfig(restored.suppConfig);
            localStorage.setItem('helseplan_supp_config', JSON.stringify(restored.suppConfig));
            delete restored.suppConfig;
          }

          // Restore main health data
          setAllData(restored);
          localStorage.setItem('healthDashboardHistory', JSON.stringify(restored));

          setSyncStatus('✓ Hentet!');
          setShowSyncModal(false);
          setTimeout(() => setSyncStatus(''), 3000);
        } catch (e) {
          console.error(e);
          setSyncStatus('❌ Feil ved henting');
          setTimeout(() => setSyncStatus(''), 3000);
        }
      };
      
      // Current week data shortcut
      const data = allData.weeks[currentWeekKey] || createFreshWeek();
      
      // Track if initial load (skip auto-sync on first render)
      const isInitialMount = React.useRef(true);
      const [cloudStatus, setCloudStatus] = useState(''); // '', 'pending', 'syncing', 'synced', 'error'
      
      useEffect(() => {
        try {
          localStorage.setItem('healthDashboardHistory', JSON.stringify(allData));
        } catch (e) {
          console.log('Could not save to localStorage');
        }
      }, [allData]);
      
      // Track if there are unsaved changes
      const hasPendingChanges = React.useRef(false);
      const latestData = React.useRef(allData);
      
      // Keep latestData ref updated
      useEffect(() => {
        latestData.current = allData;
      }, [allData]);
      
      // Debounced auto-sync: 30 seconds after last change
      useEffect(() => {
        if (isInitialMount.current) {
          isInitialMount.current = false;
          return;
        }
        
        hasPendingChanges.current = true;
        setCloudStatus('pending');
        
        const timer = setTimeout(async () => {
          const binId = getBinId();
          setCloudStatus('syncing');
          
          try {
            if (binId) {
              const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json',
                  'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify({ ...allData, lastBackup: new Date().toISOString() })
              });
              if (!res.ok) throw new Error('Auto-sync failed');
            } else {
              const res = await fetch('https://api.jsonbin.io/v3/b', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'X-Master-Key': JSONBIN_API_KEY,
                  'X-Bin-Name': 'helseplan-backup'
                },
                body: JSON.stringify({ ...allData, lastBackup: new Date().toISOString() })
              });
              if (!res.ok) throw new Error('Auto-sync failed');
              const data = await res.json();
              setBinId(data.metadata.id);
            }
            hasPendingChanges.current = false;
            setCloudStatus('synced');
            setTimeout(() => setCloudStatus(''), 3000);
          } catch (e) {
            console.error('Auto-sync error:', e);
            setCloudStatus('error');
            setTimeout(() => setCloudStatus(''), 5000);
          }
        }, 30000); // 30 seconds
        
        return () => clearTimeout(timer);
      }, [allData]);
      
      // Sync immediately when leaving page (switching apps, going to home screen)
      useEffect(() => {
        const syncOnHide = () => {
          if (document.visibilityState === 'hidden' && hasPendingChanges.current) {
            const binId = getBinId();
            const dataToSync = JSON.stringify({ 
              ...latestData.current, 
              lastBackup: new Date().toISOString() 
            });
            
            if (binId) {
              // Use fetch with keepalive to ensure request completes
              fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json',
                  'X-Master-Key': JSONBIN_API_KEY
                },
                body: dataToSync,
                keepalive: true
              }).catch(() => {}); // Fire and forget
            }
            // Note: Can't create new bin on hide (need to read response for ID)
            // But once a bin exists, syncs will work
            
            hasPendingChanges.current = false;
          }
        };
        
        document.addEventListener('visibilitychange', syncOnHide);
        return () => document.removeEventListener('visibilitychange', syncOnHide);
      }, []);
      
      useEffect(() => {
        let interval;
        if (timerActive && breakTimer > 0) {
          interval = setInterval(() => setBreakTimer(t => t - 1), 1000);
        } else if (breakTimer === 0) {
          setTimerActive(false);
          setBreakTimer(45 * 60);
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        }
        return () => clearInterval(interval);
      }, [timerActive, breakTimer]);

      const updateCurrentWeek = (updates) => {
        setAllData(prev => ({
          ...prev,
          weeks: {
            ...prev.weeks,
            [currentWeekKey]: { ...prev.weeks[currentWeekKey], ...updates }
          }
        }));
      };
      
      const toggleSupplement = (day, supp) => {
        setAllData(prev => ({
          ...prev,
          weeks: {
            ...prev.weeks,
            [currentWeekKey]: {
              ...prev.weeks[currentWeekKey],
              dailySupplements: {
                ...prev.weeks[currentWeekKey].dailySupplements,
                [day]: {
                  ...prev.weeks[currentWeekKey].dailySupplements[day],
                  supplements: {
                    ...prev.weeks[currentWeekKey].dailySupplements[day].supplements,
                    [supp]: !prev.weeks[currentWeekKey].dailySupplements[day].supplements[supp]
                  }
                }
              }
            }
          }
        }));
      };
      
      const toggleDayComplete = (day) => {
        setAllData(prev => ({
          ...prev,
          weeks: {
            ...prev.weeks,
            [currentWeekKey]: {
              ...prev.weeks[currentWeekKey],
              dailySupplements: {
                ...prev.weeks[currentWeekKey].dailySupplements,
                [day]: {
                  ...prev.weeks[currentWeekKey].dailySupplements[day],
                  completed: !prev.weeks[currentWeekKey].dailySupplements[day].completed
                }
              }
            }
          }
        }));
      };
      
      const clearDay = (day) => {
        setAllData(prev => ({
          ...prev,
          weeks: {
            ...prev.weeks,
            [currentWeekKey]: {
              ...prev.weeks[currentWeekKey],
              dailySupplements: {
                ...prev.weeks[currentWeekKey].dailySupplements,
                [day]: { supplements: { ...defaultSupplements }, completed: false }
              }
            }
          }
        }));
      };
      
      const markAllSupplements = (day, value) => {
        const allSupps = {};
        Object.keys(defaultSupplements).forEach(k => allSupps[k] = value);
        setAllData(prev => ({
          ...prev,
          weeks: {
            ...prev.weeks,
            [currentWeekKey]: {
              ...prev.weeks[currentWeekKey],
              dailySupplements: {
                ...prev.weeks[currentWeekKey].dailySupplements,
                [day]: { supplements: allSupps, completed: value }
              }
            }
          }
        }));
      };
      
      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
      };

      const currentDayKey = dayKeys[selectedDay];
      const currentDaySupps = data.dailySupplements?.[currentDayKey]?.supplements || defaultSupplements;
      const suppCount = Object.values(currentDaySupps).filter(Boolean).length;
      const completedDays = dayKeys.filter(d => data.dailySupplements?.[d]?.completed).length;
      const exerciseCount = (data.exerciseSessions?.session1 ? 1 : 0) + (data.exerciseSessions?.session2 ? 1 : 0);
      const trainingCount = (data.trainingSessions?.trening1 ? 1 : 0) + (data.trainingSessions?.trening2 ? 1 : 0);
      
      // Supplement configuration - stored in localStorage
      const defaultSupplementsList = [
        { key: 'kefir', name: 'Kefir', icon: '🥛' },
        { key: 'probiotic', name: 'Probiotic', icon: '🦠' },
        { key: 'd3k2', name: 'D3 + K2', icon: '☀️' },
        { key: 'tran', name: 'Tran', icon: '🐟' },
        { key: 'collagen', name: 'Kollagen', icon: '✨' },
        { key: 'kreatin', name: 'Kreatin', icon: '💪' },
        { key: 'magnesium', name: 'Magnesium', icon: '🌙' },
        { key: 'glycine', name: 'Glycine', icon: '😴' },
        { key: 'theanine', name: 'L-Theanine', icon: '🍵' }
      ];
      
      const defaultSuppConfig = {
        kefir: 'morning', probiotic: 'morning', d3k2: 'morning', tran: 'morning',
        collagen: 'lunch', kreatin: 'lunch',
        magnesium: 'evening', glycine: 'evening', theanine: 'evening'
      };
      
      const getSuppList = () => {
        try {
          const saved = localStorage.getItem('helseplan_supp_list');
          return saved ? JSON.parse(saved) : defaultSupplementsList;
        } catch { return defaultSupplementsList; }
      };
      
      const getSuppConfig = () => {
        try {

                                    color: '#a8d898',
                                    fontSize: '11px',
                                    fontWeight: '500',
                                    cursor: 'pointer',
                                    fontFamily: 'inherit',
                                    whiteSpace: 'nowrap'
                                  }}
                                >
                                  {copyStatus || '📋 Kopier'}
                                </button>
                              </div>
                            </div>
                          )}
                          
                          {/* Connect to other device */}
                          <div>
                            <div style={{ color: '#7a8a7a', fontSize: '11px', marginBottom: '6px' }}>
                              Lim inn ID fra annen enhet:
                            </div>
                            <div style={{ display: 'flex', gap: '8px' }}>
                              <input
                                type="text"
                                value={inputBinId}
                                onChange={(e) => setInputBinId(e.target.value)}
                                placeholder="Lim inn backup-ID her..."
                                style={{
                                  flex: 1,
                                  padding: '8px',
                                  borderRadius: '6px',
                                  border: '1px solid rgba(100, 120, 90, 0.3)',
                                  background: 'rgba(20, 30, 20, 0.8)',
                                  color: '#e8ebe8',
                                  fontSize: '11px',
                                  fontFamily: 'monospace',
                                  outline: 'none'
                                }}
                              />
                              <button
                                onClick={connectToDevice}
                                disabled={!inputBinId.trim()}
                                style={{
                                  padding: '8px 12px',
                                  borderRadius: '6px',
                                  border: '1px solid rgba(90, 120, 140, 0.3)',
                                  background: inputBinId.trim() ? 'rgba(50, 80, 100, 0.3)' : 'rgba(40, 50, 40, 0.2)',
                                  color: inputBinId.trim() ? '#a8c8d8' : '#6a7a6a',
                                  fontSize: '11px',
                                  fontWeight: '500',
                                  cursor: inputBinId.trim() ? 'pointer' : 'not-allowed',
                                  fontFamily: 'inherit',
                                  whiteSpace: 'nowrap'
                                }}
                              >
                                Koble til
                              </button>
                            </div>
                          </div>
                          
                          <div style={{ marginTop: '10px', fontSize: '10px', color: '#5a6a5a', lineHeight: '1.4' }}>
                            💡 Kopier ID fra mobiltelefon → lim inn på desktop → trykk "Koble til" → deretter "Hent backup"
                          </div>
                        </div>
                      )}
                    </div>
                    
                    <div style={{ marginTop: '12px', fontSize: '11px', color: '#5a6a5a', textAlign: 'center' }}>
                      Backup lagres trygt i skyen. Bruk "Hent" på ny enhet.
                    </div>
                  </div>
                </div>
              )}
              
              {/* Sync Confirm Modal */}
              {showSyncModal && (
                <div style={{
                  position: 'fixed',
                  top: 0,
                  left: 0,
                  right: 0,
                  bottom: 0,
                  background: 'rgba(0,0,0,0.8)',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  zIndex: 1000,
                  padding: '20px'
                }}>
                  <div className="card" style={{ maxWidth: '320px', width: '100%' }}>
                    <h3 style={{ margin: '0 0 12px', color: '#d4dcc8', fontSize: '18px' }}>⚠️ Hent backup?</h3>
                    <p style={{ color: '#8a9a8a', fontSize: '14px', marginBottom: '20px', lineHeight: '1.5' }}>
                      Dette vil erstatte all lokal data med backup fra skyen. Er du sikker?
                    </p>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                      <button
                        onClick={() => setShowSyncModal(false)}
                        style={{
                          padding: '12px',
                          borderRadius: '10px',
                          border: '1px solid rgba(100, 120, 90, 0.3)',
                          background: 'rgba(40, 50, 40, 0.5)',
                          color: '#a8b5a8',
                          fontSize: '14px',
                          cursor: 'pointer',
                          fontFamily: 'inherit'
                        }}
                      >
                        Avbryt
                      </button>
                      <button
                        onClick={restoreFromCloud}
                        style={{
                          padding: '12px',
                          borderRadius: '10px',
                          border: '1px solid rgba(100, 140, 90, 0.4)',
                          background: 'linear-gradient(135deg, #4a6b3a, #3d5a30)',
                          color: '#c4d4b0',
                          fontSize: '14px',
                          fontWeight: '600',
                          cursor: 'pointer',
                          fontFamily: 'inherit'
                        }}
                      >
                        Ja, hent
                      </button>
                    </div>
                  </div>
                </div>
              )}
              
              {/* Supplement Editor Modal */}
              {showSuppEditor && (
                <div style={{
                  position: 'fixed',
                  top: 0,
                  left: 0,
                  right: 0,
                  bottom: 0,
                  background: 'rgba(0,0,0,0.85)',
                  display: 'flex',
                  alignItems: 'flex-start',
                  justifyContent: 'center',
                  zIndex: 1000,
                  padding: '20px',
                  overflowY: 'auto'
                }}>
                  <div className="card" style={{ maxWidth: '380px', width: '100%', marginTop: '20px', marginBottom: '20px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '20px' }}>
                      <h3 style={{ margin: 0, color: '#d4dcc8', fontSize: '18px' }}>⚙️ Rediger tilskudd</h3>
                      <button
                        onClick={() => { setShowSuppEditor(false); setShowAddSupp(false); }}
                        style={{
                          width: '32px',
                          height: '32px',
                          borderRadius: '8px',
                          border: 'none',
                          background: 'rgba(100, 100, 100, 0.3)',
                          color: '#a8b5a8',
                          fontSize: '16px',
                          cursor: 'pointer',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center'
                        }}
                      >
                        ✕
                      </button>
                    </div>
                    
                    {!showAddSupp ? (
                      <>
                        <p style={{ color: '#7a8a7a', fontSize: '13px', marginBottom: '16px' }}>
                          Velg når hvert tilskudd skal tas. Trykk 🗑️ for å fjerne.
                        </p>
                        
                        <div style={{ display: 'grid', gap: '12px', maxHeight: '400px', overflowY: 'auto', paddingRight: '4px' }}>
                          {allSupplements.map((supp) => (
                            <div key={supp.key} style={{
                              background: 'rgba(30, 40, 30, 0.5)',
                              borderRadius: '10px',
                              padding: '12px',
                              border: '1px solid rgba(100, 120, 90, 0.15)'
                            }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '10px' }}>
                                <span style={{ fontSize: '20px' }}>{supp.icon}</span>
                                <span style={{ color: '#c4d4b0', fontSize: '14px', fontWeight: '500', flex: 1 }}>{supp.name}</span>
                                <button
                                  onClick={() => {
                                    if (confirm(`Fjerne ${supp.name}?`)) {
                                      removeSupplement(supp.key);
                                    }
                                  }}
                                  style={{
                                    width: '28px',
                                    height: '28px',
                                    borderRadius: '6px',
                                    border: '1px solid rgba(180, 100, 100, 0.3)',
                                    background: 'rgba(120, 60, 60, 0.2)',
                                    color: '#c8a8a8',
                                    fontSize: '12px',
                                    cursor: 'pointer',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center'
                                  }}
                                >
                                  🗑️
                                </button>
                              </div>
                              <div style={{ display: 'flex', gap: '8px' }}>
                                {[
                                  { value: 'morning', label: '🌅 Morgen', color: '#a8d898' },
                                  { value: 'lunch', label: '🌤️ Lunsj', color: '#d8c898' },
                                  { value: 'evening', label: '🌙 Kveld', color: '#a8a8d8' }
                                ].map((period) => (
                                  <button
                                    key={period.value}
                                    onClick={() => updateSuppPeriod(supp.key, period.value)}
                                    style={{
                                      flex: 1,
                                      padding: '8px 4px',
                                      borderRadius: '6px',
                                      border: suppConfig[supp.key] === period.value 
                                        ? '2px solid ' + period.color 
                                        : '1px solid rgba(100, 120, 90, 0.2)',
                                      background: suppConfig[supp.key] === period.value 
                                        ? 'rgba(100, 140, 90, 0.2)' 
                                        : 'transparent',
                                      color: suppConfig[supp.key] === period.value 
                                        ? period.color 
                                        : '#7a8a7a',
                                      fontSize: '11px',
                                      cursor: 'pointer',
                                      fontFamily: 'inherit',
                                      fontWeight: suppConfig[supp.key] === period.value ? '600' : '400',
                                      transition: 'all 0.15s ease'
                                    }}
                                  >
                                    {period.label}
                                  </button>
                                ))}
                              </div>
                            </div>
                          ))}
                        </div>
                        
                        <button
                          onClick={() => setShowAddSupp(true)}
                          style={{
                            width: '100%',
                            marginTop: '16px',
                            padding: '14px',
                            borderRadius: '10px',
                            border: '2px dashed rgba(100, 140, 90, 0.4)',
                            background: 'transparent',
                            color: '#8bab7a',
                            fontSize: '14px',
                            fontWeight: '500',
                            cursor: 'pointer',
                            fontFamily: 'inherit',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            gap: '8px'
                          }}
                        >
                          ➕ Legg til nytt tilskudd
                        </button>
                        
                        <button
                          onClick={() => { setShowSuppEditor(false); setShowAddSupp(false); }}
                          style={{
                            width: '100%',
                            marginTop: '12px',
                            padding: '14px',
                            borderRadius: '10px',
                            border: '1px solid rgba(100, 140, 90, 0.4)',
                            background: 'linear-gradient(135deg, #4a6b3a, #3d5a30)',
                            color: '#c4d4b0',
                            fontSize: '14px',
                            fontWeight: '600',
                            cursor: 'pointer',
                            fontFamily: 'inherit'
                          }}
                        >
                          ✓ Ferdig
                        </button>
                      </>
                    ) : (
                      <>
                        <p style={{ color: '#7a8a7a', fontSize: '13px', marginBottom: '16px' }}>
                          Legg til et nytt tilskudd:
                        </p>
                        
                        {/* Emoji selector */}
                        <div style={{ marginBottom: '16px' }}>
                          <label style={{ display: 'block', color: '#a8b5a8', fontSize: '12px', marginBottom: '8px' }}>Velg ikon:</label>
                          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                            {emojiOptions.map((emoji) => (
                              <button
                                key={emoji}
                                onClick={() => setNewSuppIcon(emoji)}
                                style={{
                                  width: '40px',
                                  height: '40px',
                                  borderRadius: '8px',
                                  border: newSuppIcon === emoji ? '2px solid #8bab7a' : '1px solid rgba(100, 120, 90, 0.2)',
                                  background: newSuppIcon === emoji ? 'rgba(100, 140, 90, 0.2)' : 'rgba(30, 40, 30, 0.5)',
                                  fontSize: '20px',
                                  cursor: 'pointer',
                                  display: 'flex',
                                  alignItems: 'center',
                                  justifyContent: 'center'
                                }}
                              >
                                {emoji}
                              </button>
                            ))}
                          </div>
                        </div>
                        
                        {/* Name input */}
                        <div style={{ marginBottom: '16px' }}>
                          <label style={{ display: 'block', color: '#a8b5a8', fontSize: '12px', marginBottom: '8px' }}>Navn:</label>
                          <input
                            type="text"
                            value={newSuppName}
                            onChange={(e) => setNewSuppName(e.target.value)}
                            placeholder="F.eks. Omega-3"
                            style={{
                              width: '100%',
                              padding: '12px',
                              borderRadius: '8px',
                              border: '1px solid rgba(100, 120, 90, 0.3)',
                              background: 'rgba(20, 30, 20, 0.8)',
                              color: '#e8ebe8',
                              fontSize: '14px',
                              fontFamily: 'inherit',
                              outline: 'none'
                            }}
                          />
                        </div>
                        
                        {/* Period selector */}
                        <div style={{ marginBottom: '20px' }}>
                          <label style={{ display: 'block', color: '#a8b5a8', fontSize: '12px', marginBottom: '8px' }}>Når skal det tas?</label>
                          <div style={{ display: 'flex', gap: '8px' }}>
                            {[
                              { value: 'morning', label: '🌅 Morgen', color: '#a8d898' },
                              { value: 'lunch', label: '🌤️ Lunsj', color: '#d8c898' },
                              { value: 'evening', label: '🌙 Kveld', color: '#a8a8d8' }
                            ].map((period) => (
                              <button
                                key={period.value}
                                onClick={() => setNewSuppPeriod(period.value)}
                                style={{
                                  flex: 1,
                                  padding: '12px 8px',
                                  borderRadius: '8px',
                                  border: newSuppPeriod === period.value 
                                    ? '2px solid ' + period.color 
                                    : '1px solid rgba(100, 120, 90, 0.2)',
                                  background: newSuppPeriod === period.value 
                                    ? 'rgba(100, 140, 90, 0.2)' 
                                    : 'transparent',
                                  color: newSuppPeriod === period.value 
                                    ? period.color 
                                    : '#7a8a7a',
                                  fontSize: '12px',
                                  cursor: 'pointer',
                                  fontFamily: 'inherit',
                                  fontWeight: newSuppPeriod === period.value ? '600' : '400'
                                }}
                              >
                                {period.label}
                              </button>
                            ))}
                          </div>
                        </div>
                        
                        {/* Preview */}
                        {newSuppName && (
                          <div style={{ 
                            marginBottom: '16px', 
                            padding: '12px', 
                            background: 'rgba(100, 140, 90, 0.1)', 
                            borderRadius: '8px',
                            border: '1px solid rgba(100, 140, 90, 0.2)'
                          }}>
                            <div style={{ color: '#7a8a7a', fontSize: '11px', marginBottom: '6px' }}>Forhåndsvisning:</div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                              <span style={{ fontSize: '24px' }}>{newSuppIcon}</span>
                              <span style={{ color: '#c4d4b0', fontSize: '15px', fontWeight: '500' }}>{newSuppName}</span>
                            </div>
                          </div>
                        )}
                        
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                          <button
                            onClick={() => setShowAddSupp(false)}
                            style={{
                              padding: '14px',
                              borderRadius: '10px',
                              border: '1px solid rgba(100, 120, 90, 0.3)',
                              background: 'rgba(40, 50, 40, 0.5)',
                              color: '#a8b5a8',
                              fontSize: '14px',
                              cursor: 'pointer',
                              fontFamily: 'inherit'
                            }}
                          >
                            Avbryt
                          </button>
                          <button
                            onClick={addSupplement}
                            disabled={!newSuppName.trim()}
                            style={{
                              padding: '14px',
                              borderRadius: '10px',
                              border: '1px solid rgba(100, 140, 90, 0.4)',
                              background: newSuppName.trim() ? 'linear-gradient(135deg, #4a6b3a, #3d5a30)' : 'rgba(40, 50, 40, 0.3)',
                              color: newSuppName.trim() ? '#c4d4b0' : '#6a7a6a',
                              fontSize: '14px',
                              fontWeight: '600',
                              cursor: newSuppName.trim() ? 'pointer' : 'not-allowed',
                              fontFamily: 'inherit'
                            }}
                          >
                            ➕ Legg til
                          </button>
                        </div>
                      </>
                    )}
                  </div>
                </div>
              )}
            </main>

            {/* Footer */}
            <footer style={{ marginTop: '32px', textAlign: 'center', color: '#4a5a4a', fontSize: '12px' }}>
              Små endringer, konsekvent over tid 💪
            </footer>
          </div>
          
          {/* Bottom Navigation */}
          <nav className="bottom-nav">
            {[
              { id: 'oversikt', icon: '📊', label: 'Oversikt' },
              { id: 'tarm', icon: '💊', label: 'Tilskudd' },
              { id: 'trening', icon: '🏋️', label: 'Trening' },
              { id: 'alkohol', icon: '🍺', label: 'Alkohol' },
              { id: 'historikk', icon: '📈', label: 'Historikk' }
            ].map(tab => (
              <button 
                key={tab.id}
                className={`nav-btn ${activeTab === tab.id ? 'active' : ''}`}
                onClick={() => setActiveTab(tab.id)}
              >
                <span className="nav-icon">{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HealthDashboard />);
  </script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
